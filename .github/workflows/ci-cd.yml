name: CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --disable-warnings

  review:
    name: Revue du code (LLM)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Commit de base : début du push, ou base de la pull request.
      REVIEW_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Revue du diff
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Secret ANTHROPIC_API_KEY absent : revue sautée."; exit 0
          fi
          # Nouvelle branche : pas de commit « avant », on compare à main.
          if [ -z "$REVIEW_BASE" ] || [ "$REVIEW_BASE" = "0000000000000000000000000000000000000000" ]; then
            export REVIEW_BASE=$(git merge-base origin/main HEAD)
          fi
          python smoobu_pipeline.py --review-only

  docker:
    name: Image Docker
    needs: [test, review]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Calcule le nom de l'image (ghcr exige des minuscules) et les tags :
      #   main    -> :latest  + :<sha>   (publiée)
      #   develop -> :staging + :<sha>   (publiée)
      #   autres  -> construite seulement (vérification)
      - name: Tags de l'image
        id: meta
        run: |
          IMAGE_LC="${IMAGE,,}"
          echo "image=$IMAGE_LC" >> "$GITHUB_OUTPUT"
          PUSH=false
          case "$GITHUB_REF" in
            refs/heads/main)    CHANNEL=latest ;;
            refs/heads/develop) CHANNEL=staging ;;
            *)                  CHANNEL=ci ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$CHANNEL" != "ci" ]; then
            PUSH=true
          fi
          {
            echo "push=$PUSH"
            echo "tags<<EOF"
            echo "$IMAGE_LC:$CHANNEL"
            echo "$IMAGE_LC:$GITHUB_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Connexion à GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Déploiement staging
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    # Un seul déploiement staging à la fois ; un nouveau push annule l'ancien.
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Préparer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Déployer sur le serveur de staging
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          STAGING_DIR: ${{ vars.STAGING_DIR }}
          IMAGE: ${{ needs.docker.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes \
              "$SSH_USER@$SSH_HOST" \
              "IMAGE='$IMAGE' IMAGE_TAG='$IMAGE_TAG' STAGING_DIR='$STAGING_DIR' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'EOF'
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          cd "$STAGING_DIR"
          export IMAGE IMAGE_TAG
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
          docker image prune -f
          docker logout ghcr.io
          EOF
